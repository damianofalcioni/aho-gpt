name: Build and Publish Release

on:
  push:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      play_track: ${{ steps.play_track.outputs.track }}
      is_prerelease: ${{ steps.play_track.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Select Google Play track
        id: play_track
        if: github.event_name == 'release'
        env:
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PLAY_PRERELEASE_TRACK: ${{ vars.PLAY_PRERELEASE_TRACK }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s extglob

          version="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle)"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Unable to read a numeric versionName from app/build.gradle." >&2
            exit 1
          fi
          if [[ "$IS_PRERELEASE" != true && "$IS_PRERELEASE" != false ]]; then
            echo "IS_PRERELEASE must be true or false." >&2
            exit 1
          fi

          prerelease="$IS_PRERELEASE"
          beta_tag="v${version}-beta"
          beta_number="${RELEASE_TAG#"$beta_tag."}"
          if [[ "$RELEASE_TAG" == "v$version" ]]; then
            if [[ "$prerelease" == true ]]; then
              echo "Numeric v${version} tags are reserved for stable F-Droid updates. Use v${version}-beta[.N] for prereleases." >&2
              exit 1
            fi
          elif [[ "$RELEASE_TAG" == "$beta_tag" ||
                  ( "$RELEASE_TAG" == "$beta_tag".* && "$beta_number" =~ ^[1-9][0-9]*$ ) ]]; then
            prerelease=true
          else
            echo "Release tag must match v${version} or v${version}-beta[.N]." >&2
            exit 1
          fi

          track=production
          if [[ "$prerelease" == true ]]; then
            track="${PLAY_PRERELEASE_TRACK:-}"
            track="${track##+([[:space:]])}"
            track="${track%%+([[:space:]])}"
            track="${track:-alpha}"
            destination="${track##*:}"
            if [[ ! "$track" =~ ^[A-Za-z0-9][A-Za-z0-9_.:-]*$ || "${destination,,}" == production ]]; then
              echo "PLAY_PRERELEASE_TRACK must be one testing-track identifier, never production." >&2
              exit 1
            fi
          fi

          printf 'prerelease=%s\ntrack=%s\n' "$prerelease" "$track" >> "$GITHUB_OUTPUT"
          echo "Google Play destination: $track"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Ensure gradlew executable
        run: chmod +x ./gradlew

      - name: Run lint, maintainability checks, and tests
        run: ./gradlew lintFdroidHandheldDebug lintFdroidWearDebug lintGplayHandheldDebug lintGplayWearDebug complexityCheck testFdroidHandheldDebugUnitTest testFdroidWearDebugUnitTest testGplayHandheldDebugUnitTest testGplayWearDebugUnitTest verifyReleaseVersionCode

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -n "$KEYSTORE_BASE64" ]]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release-keystore.jks"
          elif [[ "$GITHUB_EVENT_NAME" == release ]]; then
            echo 'Missing secret: ANDROID_KEYSTORE_BASE64' >&2
            exit 1
          fi

      - name: Build signed release artifacts
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ ! -s "$ANDROID_KEYSTORE_PATH" ]]; then
            unset ANDROID_KEYSTORE_PATH
          fi
          if [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
            for name in ANDROID_KEYSTORE_PATH ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
              [[ -n "${!name:-}" ]] || { echo "Missing signing variable: $name" >&2; exit 1; }
            done
            ./gradlew assembleDebug assembleRelease bundleGplayHandheldRelease bundleGplayWearRelease
          else
            ./gradlew assembleDebug assembleRelease
          fi

      - name: Prepare Google Play bundle and release notes
        if: github.event_name == 'release'
        run: |
          python <<'PY'
          import json
          import os
          import shutil
          from pathlib import Path

          metadata = json.loads(Path("app/build/outputs/apk/gplayHandheld/release/output-metadata.json").read_text())
          version_code = metadata["elements"][0]["versionCode"]
          notes = Path(f"fastlane/metadata/android/en-US/changelogs/{version_code}.txt").read_text(encoding="utf-8").strip()
          if not notes or len(notes) > 500:
              raise SystemExit("Google Play release notes must contain 1 to 500 characters. Review the Fastlane changelog before publishing.")
          release_dir = Path(os.environ["RUNNER_TEMP"]) / "play-release"
          notes_dir = release_dir / "whatsnew"
          notes_dir.mkdir(parents=True, exist_ok=True)
          for device in ("handheld", "wear"):
              variant = f"gplay{device.capitalize()}Release"
              shutil.copyfile(f"app/build/outputs/bundle/{variant}/app-gplay-{device}-release.aab", release_dir / f"app-gplay-{device}-release.aab")
          (notes_dir / "whatsnew-en-US").write_text(notes, encoding="utf-8")
          PY

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-apks
          if-no-files-found: error
          path: |
            app/build/outputs/apk/

      - name: Upload Google Play release artifact
        if: github.event_name == 'release'
        uses: actions/upload-artifact@v7
        with:
          name: play-release-bundle
          if-no-files-found: error
          path: ${{ runner.temp }}/play-release/

      - name: Attach signed FOSS APK to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name }}
          prerelease: ${{ steps.play_track.outputs.prerelease == 'true' }}
          fail_on_unmatched_files: true
          files: |
            app/build/outputs/apk/fdroidHandheld/release/app-fdroid-handheld-release.apk
            app/build/outputs/apk/fdroidWear/release/app-fdroid-wear-release.apk

  publish_play:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - device: handheld
            package: aho.gpt
          - device: wear
            package: aho.gpt.wear
    permissions:
      contents: read
    concurrency:
      group: google-play-aho.gpt
      cancel-in-progress: false
    steps:
      - name: Download signed Google Play bundle and release notes
        uses: actions/download-artifact@v8
        with:
          name: play-release-bundle
          path: play-release

      - name: Validate Google Play credentials
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          test -n "$PLAY_SERVICE_ACCOUNT_JSON" || { echo "Missing secret: PLAY_SERVICE_ACCOUNT_JSON"; exit 1; }

      - name: Publish Google Play ${{ needs.build.outputs.play_track }} release
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ matrix.package }}
          releaseFiles: play-release/app-gplay-${{ matrix.device }}-release.aab
          releaseName: ${{ github.event.release.tag_name }}
          tracks: ${{ needs.build.outputs.play_track }}
          status: completed
          whatsNewDirectory: play-release/whatsnew

  submit_fdroid:
    needs: build
    if: github.event_name == 'release' && needs.build.outputs.is_prerelease == 'false'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        device: [handheld, wear]
    uses: ./.github/workflows/fdroid-submit.yml
    with:
      release_ref: ${{ github.event.release.tag_name }}
      release_artifact: release-apks
      device: ${{ matrix.device }}
    secrets: inherit
