name: Google Play Listing

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Upload the listing and allow submission for Google review (false only validates and prepares files)
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: google-play-aho.gpt
  cancel-in-progress: false

jobs:
  listing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Validate and prepare listing
        run: |
          chmod +x ./gradlew
          ./gradlew :app:preparePlayListing

      - name: Upload prepared listing for inspection
        uses: actions/upload-artifact@v7
        with:
          name: google-play-listing
          path: app/build/generated/store-listing/play
          if-no-files-found: error

      - name: Publish listing and allow Google review
        if: inputs.publish
        env:
          ANDROID_PUBLISHER_CREDENTIALS: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [[ -z "$ANDROID_PUBLISHER_CREDENTIALS" ]]; then
            echo 'Missing PLAY_SERVICE_ACCOUNT_JSON repository secret.' >&2
            exit 1
          fi
          ./gradlew -PplayPublishing -PplaySubmitForReview=true :app:publishPlayListing
