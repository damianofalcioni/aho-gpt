plugins {
    id "com.android.application"
    id "pmd"
}

android {
    // AGP 9 otherwise adds Kotlin's standard library even to Java-only apps.
    enableKotlin = false
    buildFeatures { buildConfig = true }
    namespace = "aho.gpt"
    compileSdk = 37
    defaultConfig {
        applicationId = "aho.gpt"
        minSdk = 23
        targetSdk = 37
        versionCode = 1000
        versionName = "0.1.0"
        testInstrumentationRunner = "aho.gpt.android.tools.IntentLaunchTests"
    }
    flavorDimensions += ["distribution", "device"]
    // Keep both display languages available for the in-app language switch.
    bundle { language { enableSplit = false } }
    productFlavors {
        gplay { dimension = "distribution" }
        fdroid { dimension = "distribution" }
        handheld { dimension = "device" }
        wear { dimension = "device"; applicationIdSuffix = ".wear"; minSdk = 26 }
    }
    signingConfigs {
        release {
            def keystorePath = System.getenv("ANDROID_KEYSTORE_PATH")
            if (keystorePath) {
                storeFile = rootProject.file(keystorePath)
                storePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias = System.getenv("ANDROID_KEY_ALIAS")
                keyPassword = System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        debug { applicationIdSuffix = ".debug" }
        release {
            if (System.getenv("ANDROID_KEYSTORE_PATH")) {
                signingConfig = signingConfigs.release
            }
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt")
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    dependenciesInfo { includeInApk = false; includeInBundle = false }
    lint {
        warningsAsErrors = true
        abortOnError = true
        // Deliberately pin the user's reference toolchain; upgrades are a separate change.
        disable "AndroidGradlePluginVersion"
    }
}

// No runtime libraries. Android supplies UI, speech, JSON, TLS and cryptography.
dependencies { testImplementation "junit:junit:4.13.2"; testImplementation "org.json:json:20260814" }

pmd {
    toolVersion = "7.27.0"
    consoleOutput = true
    ruleSetFiles = files("$rootDir/config/pmd/ai-maintainability-ruleset.xml")
    ruleSets = []
}
tasks.register("complexityCheck", Pmd) {
    group = "verification"
    source = fileTree("src") { include "**/*.java" }
    ruleSetFiles = files("$rootDir/config/pmd/ai-maintainability-ruleset.xml")
    ruleSets = []
    ignoreFailures = false
    reports { xml.required = true; html.required = true }
}
tasks.named("check").configure { dependsOn("complexityCheck") }

// Store tooling is opt-in and never becomes an Android runtime dependency.
apply from: "$rootDir/gradle/play-listing.gradle"
if (providers.gradleProperty("playPublishing").map { it.isEmpty() || it.toBoolean() }.getOrElse(false)) {
    apply plugin: "com.github.triplet.play"
    apply from: "$rootDir/gradle/play-publish.gradle"
}
